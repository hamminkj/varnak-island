name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Export web build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ~/.local/share/godot/export_templates
          T=/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          D=$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          if [ "$T" != "$D" ] && [ -d "$T" ]; then mv "$T" "$D"; fi
          ls ~/.local/share/godot/export_templates/ || true
          mkdir -p build/web
          godot --headless --import > import.log 2>&1 || true
          if ! godot --headless --export-release "Web" build/web/index.html > export.log 2>&1; then
            echo "::error::EXPORT FAILED: $(grep -iE 'error|fail|missing|invalid' export.log | head -8 | tr '\n' ' ') || TAIL: $(tail -8 export.log | tr '\n' ' ')"
            exit 1
          fi
          ls -la build/web
          touch build/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
